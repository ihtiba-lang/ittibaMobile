<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ittiba Seed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --gold:#C6A34D; --gold-ink:#231A05; --sage:#6FA97D; --clay:#C1543A;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *,*::before,*::after{box-sizing:inherit;}

  :root:not([data-theme="light"]){
    --bg:#0E1B18; --surface:#15302A; --surface2:#1C3A32; --border:#2C4A41;
    --text:#F3F0E7; --muted:#93AAA1; --accent:var(--gold); --accent-ink:var(--gold-ink);
  }
  :root[data-theme="dark"]{
    --bg:#0E1B18; --surface:#15302A; --surface2:#1C3A32; --border:#2C4A41;
    --text:#F3F0E7; --muted:#93AAA1; --accent:var(--gold); --accent-ink:var(--gold-ink);
  }
  :root[data-theme="light"]{
    --bg:#EDEFE6; --surface:#FFFFFF; --surface2:#F4F5EE; --border:#D8DACB;
    --text:#14251F; --muted:#5B6E66; --accent:#9C7A1E; --accent-ink:#FFF8E6;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#EDEFE6; --surface:#FFFFFF; --surface2:#F4F5EE; --border:#D8DACB;
      --text:#14251F; --muted:#5B6E66; --accent:#9C7A1E; --accent-ink:#FFF8E6;
    }
  }

  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.display{font-family:'Fraunces',serif;}

  .app{
    max-width:520px; margin:0 auto;
    min-height:100%;
    display:flex; flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  header .word{font-size:1.3rem; font-weight:600; letter-spacing:.2px;}
  header .word span{color:var(--muted); font-family:'IBM Plex Sans',sans-serif; font-size:.85rem; font-weight:400; margin-left:6px;}

  .tabs{display:flex; gap:6px; background:var(--surface2); padding:4px; border-radius:999px;}
  .tabs button{
    border:none; background:transparent; color:var(--muted);
    font:inherit; font-size:.85rem; font-weight:600; padding:8px 14px;
    border-radius:999px; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--text);}

  section.card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px;
  }
  section.card h2{
    margin:0 0 12px; font-size:1rem; font-weight:600; display:flex; align-items:center; justify-content:space-between;
  }
  section.card h2 small{
    font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:.78rem; color:var(--muted);
  }

  label{display:block; font-size:.78rem; color:var(--muted); margin:0 0 6px; font-weight:500;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}

  input[type=text],input[type=date],input[type=number]{
    width:100%; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font:inherit; font-size:1rem; padding:12px 14px;
    border-radius:10px; -webkit-appearance:none; appearance:none;
  }
  input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{
    flex:1 1 auto; min-height:44px; min-width:44px;
    border:1px solid var(--border); background:var(--surface2); color:var(--text);
    font:inherit; font-size:.92rem; font-weight:500; border-radius:10px; cursor:pointer;
  }
  .seg button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}

  .stepper{display:flex; align-items:stretch; gap:8px;}
  .stepper button{
    width:44px; min-height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:1.25rem; line-height:1; cursor:pointer;
  }
  .stepper input{text-align:center; flex:1; min-width:0;}
  .ayah-row{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end;}
  .ayah-row .to{color:var(--muted); font-size:.85rem; text-align:center; padding-bottom:12px;}

  .surah-chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; cursor:pointer;
  }
  .surah-chip .name{font-weight:600;}
  .surah-chip .meta{color:var(--muted); font-size:.8rem;}
  .surah-chip .change{color:var(--accent); font-size:.82rem; font-weight:600; white-space:nowrap;}

  .surah-picker{margin-top:8px;}
  .surah-list{
    max-height:230px; overflow-y:auto; border:1px solid var(--border); border-radius:10px;
    margin-top:8px; background:var(--surface2);
  }
  .surah-list .row{
    padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer;
    display:flex; justify-content:space-between; gap:10px; font-size:.94rem;
  }
  .surah-list .row:last-child{border-bottom:none;}
  .surah-list .row:active{background:var(--surface);}
  .surah-list .row .n{color:var(--muted); font-size:.82rem;}
  .surah-list .empty{padding:16px; color:var(--muted); font-size:.88rem; text-align:center;}

  .r2toggle{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); cursor:pointer; user-select:none;}
  .r2toggle input{width:18px; height:18px; accent-color:var(--accent);}
  .r2body[data-off="1"]{opacity:.4; pointer-events:none;}

  .spacer{flex:1;}
  .bottom-bar{
    position:sticky; bottom:0;
    padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .save-btn{
    width:100%; min-height:52px; border:none; border-radius:12px;
    background:var(--accent); color:var(--accent-ink); font:inherit;
    font-size:1.02rem; font-weight:600; cursor:pointer;
  }
  .save-btn:disabled{opacity:.6;}

  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px));
    max-width:488px; margin:0 auto;
    background:var(--text); color:var(--bg);
    padding:12px 16px; border-radius:10px; font-size:.9rem; font-weight:500;
    transform:translateY(20px); opacity:0; pointer-events:none;
    transition:transform .25s ease, opacity .25s ease;
    z-index:20;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  .toast.err{background:var(--clay); color:#fff;}
  .toast.ok{background:var(--sage); color:#0E1B18;}

  .pending-item{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;
  }
  .pending-item .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .pending-item .who{font-weight:600;}
  .pending-item .when{color:var(--muted); font-size:.8rem;}
  .pending-item .rk{font-size:.9rem; margin:2px 0; color:var(--text);}
  .pending-item .rk .lbl{color:var(--muted);}
  .pending-item .actions{display:flex; gap:8px; margin-top:10px;}
  .pending-item .actions button{
    flex:1; min-height:40px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font:inherit; font-weight:600; font-size:.86rem; cursor:pointer;
  }
  .pending-item .actions button.confirm{background:var(--sage); border-color:var(--sage); color:#0E1B18;}

  .empty-state{color:var(--muted); text-align:center; padding:48px 20px; font-size:.92rem;}
  .refresh{
    background:none; border:none; color:var(--muted); font:inherit; font-size:.85rem;
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 0;
  }
  .loading-row{color:var(--muted); font-size:.88rem; padding:20px 0; text-align:center;}

  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="word">Ittiba <span>seed tool</span></div>
    <div class="tabs">
      <button id="tabSeedBtn" class="active">Seed</button>
      <button id="tabPendingBtn">Pending</button>
    </div>
  </header>

  <!-- SEED TAB -->
  <div id="tabSeed">

    <section class="card">
      <h2>Mosque &amp; prayer</h2>
      <div class="field">
        <div class="seg" id="mosqueSeg">
          <button data-v="makkah" class="on">Makkah</button>
          <button data-v="madinah">Madinah</button>
        </div>
      </div>
      <div class="field">
        <div class="seg" id="prayerSeg">
          <button data-v="Fajr" class="on">Fajr</button>
          <button data-v="Maghrib">Maghrib</button>
          <button data-v="Isha">Isha</button>
          <button data-v="Jumuah">Jumuah</button>
        </div>
      </div>
      <div class="field">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label for="imamInput">Imam</label>
        <input type="text" id="imamInput" placeholder="Imam name">
      </div>
    </section>

    <section class="card" id="r1card">
      <h2>Rakah 1</h2>
      <div id="r1surah"></div>
      <div class="field ayah-row" style="margin-top:14px;">
        <div>
          <label>Ayah start</label>
          <div class="stepper" data-stepper="r1s"></div>
        </div>
        <div class="to">to</div>
        <div>
          <label>Ayah end</label>
          <div class="stepper" data-stepper="r1e"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>
        Rakah 2
        <label class="r2toggle"><input type="checkbox" id="r2on" checked> include</label>
      </h2>
      <div class="r2body" id="r2body">
        <div id="r2surah"></div>
        <div class="field ayah-row" style="margin-top:14px;">
          <div>
            <label>Ayah start</label>
            <div class="stepper" data-stepper="r2s"></div>
          </div>
          <div class="to">to</div>
          <div>
            <label>Ayah end</label>
            <div class="stepper" data-stepper="r2e"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="spacer"></div>
    <div class="bottom-bar">
      <button class="save-btn" id="saveBtn">Save session</button>
    </div>
  </div>

  <!-- PENDING TAB -->
  <div id="tabPending" hidden>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
    <div id="pendingList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://ittiba-ittiba.hf.space";

const SURAHS = [
  [1,"Al-Fatihah",7],[2,"Al-Baqarah",286],[3,"Ali 'Imran",200],[4,"An-Nisa",176],
  [5,"Al-Ma'idah",120],[6,"Al-An'am",165],[7,"Al-A'raf",206],[8,"Al-Anfal",75],
  [9,"At-Tawbah",129],[10,"Yunus",109],[11,"Hud",123],[12,"Yusuf",111],
  [13,"Ar-Ra'd",43],[14,"Ibrahim",52],[15,"Al-Hijr",99],[16,"An-Nahl",128],
  [17,"Al-Isra",111],[18,"Al-Kahf",110],[19,"Maryam",98],[20,"Taha",135],
  [21,"Al-Anbya",112],[22,"Al-Hajj",78],[23,"Al-Mu'minun",118],[24,"An-Nur",64],
  [25,"Al-Furqan",77],[26,"Ash-Shu'ara",227],[27,"An-Naml",93],[28,"Al-Qasas",88],
  [29,"Al-Ankabut",69],[30,"Ar-Rum",60],[31,"Luqman",34],[32,"As-Sajdah",30],
  [33,"Al-Ahzab",73],[34,"Saba",54],[35,"Fatir",45],[36,"Ya-Sin",83],
  [37,"As-Saffat",182],[38,"Sad",88],[39,"Az-Zumar",75],[40,"Ghafir",85],
  [41,"Fussilat",54],[42,"Ash-Shuraa",53],[43,"Az-Zukhruf",89],[44,"Ad-Dukhan",59],
  [45,"Al-Jathiyah",37],[46,"Al-Ahqaf",35],[47,"Muhammad",38],[48,"Al-Fath",29],
  [49,"Al-Hujurat",18],[50,"Qaf",45],[51,"Adh-Dhariyat",60],[52,"At-Tur",49],
  [53,"An-Najm",62],[54,"Al-Qamar",55],[55,"Ar-Rahman",78],[56,"Al-Waqi'ah",96],
  [57,"Al-Hadid",29],[58,"Al-Mujadila",22],[59,"Al-Hashr",24],[60,"Al-Mumtahanah",13],
  [61,"As-Saf",14],[62,"Al-Jumu'ah",11],[63,"Al-Munafiqun",11],[64,"At-Taghabun",18],
  [65,"At-Talaq",12],[66,"At-Tahrim",12],[67,"Al-Mulk",30],[68,"Al-Qalam",52],
  [69,"Al-Haqqah",52],[70,"Al-Ma'arij",44],[71,"Nuh",28],[72,"Al-Jinn",28],
  [73,"Al-Muzzammil",20],[74,"Al-Muddaththir",56],[75,"Al-Qiyamah",40],[76,"Al-Insan",31],
  [77,"Al-Mursalat",50],[78,"An-Naba",40],[79,"An-Nazi'at",46],[80,"Abasa",42],
  [81,"At-Takwir",29],[82,"Al-Infitar",19],[83,"Al-Mutaffifin",36],[84,"Al-Inshiqaq",25],
  [85,"Al-Buruj",22],[86,"At-Tariq",17],[87,"Al-A'la",19],[88,"Al-Ghashiyah",26],
  [89,"Al-Fajr",30],[90,"Al-Balad",20],[91,"Ash-Shams",15],[92,"Al-Layl",21],
  [93,"Ad-Duhaa",11],[94,"Ash-Sharh",8],[95,"At-Tin",8],[96,"Al-Alaq",19],
  [97,"Al-Qadr",5],[98,"Al-Bayyinah",8],[99,"Az-Zalzalah",8],[100,"Al-Adiyat",11],
  [101,"Al-Qari'ah",11],[102,"At-Takathur",8],[103,"Al-Asr",3],[104,"Al-Humazah",9],
  [105,"Al-Fil",5],[106,"Quraysh",4],[107,"Al-Ma'un",7],[108,"Al-Kawthar",3],
  [109,"Al-Kafirun",6],[110,"An-Nasr",3],[111,"Al-Masad",5],[112,"Al-Ikhlas",4],
  [113,"Al-Falaq",5],[114,"An-Nas",6],
].map(([id,name,ayahs])=>({id,name,ayahs}));

const state = {
  mosque:"makkah", prayer:"Fajr",
  r1: {surah:null, ayahs:1, s:1, e:1},
  r2: {surah:null, ayahs:1, s:1, e:1},
  imamCache:null, lastPrefill:"",
};

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove("show"), 3200);
}

// ---- surah picker ----
function renderSurahField(container, key){
  const s = state[key];
  container.innerHTML = "";
  const chip = document.createElement("div");
  chip.className = "surah-chip";
  if (s.surah){
    chip.innerHTML = `<div><div class="name">${s.surah.id} · ${s.surah.name}</div>
      <div class="meta">${s.surah.ayahs} ayahs</div></div><div class="change">change</div>`;
  } else {
    chip.innerHTML = `<div><div class="name">Choose a surah</div>
      <div class="meta">Tap to search</div></div><div class="change">select</div>`;
  }
  container.appendChild(chip);

  const picker = document.createElement("div");
  picker.className = "surah-picker";
  picker.hidden = true;
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "Search by name or number…";
  const list = document.createElement("div");
  list.className = "surah-list";
  picker.appendChild(input); picker.appendChild(list);
  container.appendChild(picker);

  function renderList(q){
    const query = (q||"").trim().toLowerCase();
    const matches = SURAHS.filter(su =>
      !query || su.name.toLowerCase().includes(query) || String(su.id) === query
    ).slice(0,114);
    list.innerHTML = "";
    if (!matches.length){
      list.innerHTML = `<div class="empty">No surah matches "${q}"</div>`;
      return;
    }
    matches.forEach(su=>{
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span>${su.name}</span><span class="n">${su.id} · ${su.ayahs} ayahs</span>`;
      row.addEventListener("click", ()=>{
        state[key].surah = su;
        state[key].s = 1;
        state[key].e = su.ayahs;
        renderSurahField(container, key);
        renderStepper(key+"s");
        renderStepper(key+"e");
      });
      list.appendChild(row);
    });
  }

  chip.addEventListener("click", ()=>{
    picker.hidden = !picker.hidden;
    if (!picker.hidden){ renderList(""); input.focus(); }
  });
  input.addEventListener("input", ()=> renderList(input.value));
}

// ---- ayah steppers ----
function renderStepper(id){
  const [key, which] = [id.slice(0,2), id.slice(2)];
  const holder = document.querySelector(`[data-stepper="${id}"]`);
  const max = state[key].surah ? state[key].surah.ayahs : 300;
  const field = which === "s" ? "s" : "e";
  let val = state[key][field];
  holder.innerHTML = "";
  const minus = document.createElement("button"); minus.textContent = "–"; minus.type="button";
  const inp = document.createElement("input"); inp.type = "number"; inp.inputMode = "numeric";
  inp.min = 1; inp.max = max; inp.value = val;
  const plus = document.createElement("button"); plus.textContent = "+"; plus.type="button";

  function clamp(v){ v = parseInt(v,10); if(isNaN(v)) v = 1; return Math.max(1, Math.min(max, v)); }
  function set(v){
    state[key][field] = clamp(v);
    inp.value = state[key][field];
    if (field === "s" && state[key].s > state[key].e) state[key].e = state[key].s;
    if (field === "e" && state[key].e < state[key].s) state[key].s = state[key].e;
    if (field === "s") renderStepper(key+"e");
  }
  minus.addEventListener("click", ()=> set(state[key][field]-1));
  plus.addEventListener("click", ()=> set(state[key][field]+1));
  inp.addEventListener("change", ()=> set(inp.value));

  holder.appendChild(minus); holder.appendChild(inp); holder.appendChild(plus);
}

// ---- segmented controls ----
function wireSeg(id, onPick){
  const seg = document.getElementById(id);
  seg.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      seg.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      onPick(btn.dataset.v);
    });
  });
}

async function prefillImam(){
  try{
    if (!state.imamCache){
      const r = await fetch(`${API}/imam`);
      state.imamCache = await r.json();
    }
    const suggestion = (state.imamCache[state.mosque]||{})[state.prayer] || "";
    const box = document.getElementById("imamInput");
    if (!box.value || box.value === state.lastPrefill){
      box.value = suggestion;
      state.lastPrefill = suggestion;
    }
  } catch(e){ /* no imam suggestion available — leave field as-is */ }
}

wireSeg("mosqueSeg", v => { state.mosque = v; prefillImam(); });
wireSeg("prayerSeg", v => { state.prayer = v; prefillImam(); });

document.getElementById("dateInput").value = todayISO();
renderSurahField(document.getElementById("r1surah"), "r1");
renderSurahField(document.getElementById("r2surah"), "r2");
renderStepper("r1s"); renderStepper("r1e");
renderStepper("r2s"); renderStepper("r2e");
prefillImam();

document.getElementById("r2on").addEventListener("change", (e)=>{
  document.getElementById("r2body").dataset.off = e.target.checked ? "0" : "1";
});

// ---- save ----
document.getElementById("saveBtn").addEventListener("click", async ()=>{
  if (!state.r1.surah){
    toast("Pick a surah for Rakah 1 first", "err"); return;
  }
  const r2Included = document.getElementById("r2on").checked;
  if (r2Included && !state.r2.surah){
    toast("Pick a surah for Rakah 2, or turn its toggle off", "err"); return;
  }
  const body = {
    mosque: state.mosque,
    prayer: state.prayer,
    date: document.getElementById("dateInput").value,
    imam: document.getElementById("imamInput").value || null,
    rakah_1: {
      surah: state.r1.surah.id, surah_name: state.r1.surah.name,
      ayah_start: state.r1.s, ayah_end: state.r1.e,
    },
    rakah_2: r2Included ? {
      surah: state.r2.surah.id, surah_name: state.r2.surah.name,
      ayah_start: state.r2.s, ayah_end: state.r2.e,
    } : null,
  };
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const r = await fetch(`${API}/seed/session`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`Server said ${r.status}`);
    if (navigator.vibrate) navigator.vibrate(15);
    toast(`Saved — ${body.mosque} ${body.prayer} ${body.date}`, "ok");
  } catch(e){
    toast(`Couldn't save — ${e.message}. Check the connection and try again.`, "err");
  } finally{
    btn.disabled = false; btn.textContent = "Save session";
  }
});

// ---- tabs ----
const tabSeed = document.getElementById("tabSeed");
const tabPending = document.getElementById("tabPending");
document.getElementById("tabSeedBtn").addEventListener("click", ()=>{
  tabSeed.hidden = false; tabPending.hidden = true;
  document.getElementById("tabSeedBtn").classList.add("active");
  document.getElementById("tabPendingBtn").classList.remove("active");
});
document.getElementById("tabPendingBtn").addEventListener("click", ()=>{
  tabSeed.hidden = true; tabPending.hidden = false;
  document.getElementById("tabPendingBtn").classList.add("active");
  document.getElementById("tabSeedBtn").classList.remove("active");
  loadPending();
});
document.getElementById("refreshBtn").addEventListener("click", loadPending);

function rakSummary(r){
  if (!r) return "—";
  return `${r.surah_name} ${r.ayah_start}–${r.ayah_end}`;
}

async function loadPending(){
  const list = document.getElementById("pendingList");
  list.innerHTML = `<div class="loading-row">Loading…</div>`;
  try{
    const r = await fetch(`${API}/pending`);
    if (!r.ok) throw new Error(`Server said ${r.status}`);
    const data = await r.json();
    if (!data.pending || !data.pending.length){
      list.innerHTML = `<div class="empty-state">Nothing waiting. Every detected session has been confirmed.</div>`;
      return;
    }
    list.innerHTML = "";
    data.pending.forEach(item=>{
      const el = document.createElement("div");
      el.className = "pending-item";
      const mosqueName = item.mosque === "makkah" ? "Makkah" : "Madinah";
      el.innerHTML = `
        <div class="top">
          <div class="who">${mosqueName} · ${item.prayer}</div>
          <div class="when">${item.date}</div>
        </div>
        <div class="rk"><span class="lbl">R1</span> ${rakSummary(item.r1)}</div>
        <div class="rk"><span class="lbl">R2</span> ${rakSummary(item.r2)}</div>
        <div class="actions">
          <button class="edit">Edit</button>
          <button class="confirm">Confirm ✓</button>
        </div>`;
      el.querySelector(".edit").addEventListener("click", ()=> editPending(item));
      el.querySelector(".confirm").addEventListener("click", async (ev)=>{
        ev.target.disabled = true; ev.target.textContent = "…";
        try{
          const cr = await fetch(`${API}/confirm/${item.id}`, {method:"POST"});
          if (!cr.ok) throw new Error(`Server said ${cr.status}`);
          toast("Confirmed", "ok");
          loadPending();
        } catch(e){
          toast(`Couldn't confirm — ${e.message}`, "err");
          ev.target.disabled = false; ev.target.textContent = "Confirm ✓";
        }
      });
      list.appendChild(el);
    });
  } catch(e){
    list.innerHTML = `<div class="empty-state">Couldn't load pending sessions — ${e.message}. Check the connection and refresh.</div>`;
  }
}

function editPending(item){
  state.mosque = item.mosque; state.prayer = item.prayer;
  document.querySelectorAll("#mosqueSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v===item.mosque));
  document.querySelectorAll("#prayerSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v===item.prayer));
  document.getElementById("dateInput").value = item.date;
  document.getElementById("imamInput").value = item.imam || "";

  function apply(key, r){
    if (r){
      const su = SURAHS.find(s=>s.id===r.surah) || {id:r.surah, name:r.surah_name, ayahs:Math.max(r.ayah_end,1)};
      state[key].surah = su; state[key].s = r.ayah_start; state[key].e = r.ayah_end;
    } else {
      state[key].surah = null; state[key].s = 1; state[key].e = 1;
    }
  }
  apply("r1", item.r1);
  apply("r2", item.r2);
  document.getElementById("r2on").checked = !!item.r2;
  document.getElementById("r2body").dataset.off = item.r2 ? "0" : "1";

  renderSurahField(document.getElementById("r1surah"), "r1");
  renderSurahField(document.getElementById("r2surah"), "r2");
  renderStepper("r1s"); renderStepper("r1e");
  renderStepper("r2s"); renderStepper("r2e");

  document.getElementById("tabSeedBtn").click();
  window.scrollTo({top:0, behavior:"smooth"});
  toast("Loaded into Seed — edit and save to correct it");
}
</script>
